<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--meta tag for search engines-->
    <meta
      name="description"
      content="Adore Running - club for runners in Dublin Ireland. Urban running, trail running. 
    Dublin docklands and Pheonix Park."
    />
    <meta
      name="keywords"
      content="Adore running,run, running club, runners, Ireland, Dublin, sport, exercise"
    />
    <!--title-->
    <title>Adore Running</title>
    <!--favicon-->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon/favicon-16x16.png"
    />
    <!--stylesheet-->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <!--Header-->
    <header>
      <a href="index.html"><h1 id="logo">Adore Running</h1> </a>
      <input type="checkbox" id="nav-toggle" name="nav-toggle" />
      <label for="nav-toggle" class="nav-toggle-label"><i class="fa-solid fa-bars"></i></label>
      <nav>
        <ul id="menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="signup.html" class="active">Sign Up</a></li>
        </ul>
      </nav>
    </header>

    <!--Main content-->
    <main>
      <section id="signup">
        <form id="signup-form" method="POST" action="https://formdump.codeinstitute.net">
          <h2><i class="fa-solid fa-heart-pulse"></i> Let's get you signed up!</h2>
          <label for="first-name">First Name</label>
          <input type="text" name="first_name" id="first-name" class="text-input" required>
          <br>
          <label for="last-name">Last Name</label>
          <input type="text" name="last_name" id="last-name" class="text-input" required>
          <br>
          <label for="email-address">Email Address</label>
          <input type="email" name="email_address" id="email-name" class="text-input" required>
          <br>
          <div class="radio-buttons">
                    <div>
                        <label for="road">Road</label>
                        <input type="radio" name="running_preference" id="road" value="road" required checked>
                    </div>
                    <div>
                        <label for="trail">Trail</label>
                        <input type="radio" name="running_preference" id="trail" value="trail" required>
                    </div>
                    <div>
                        <label for="both">Both</label>
                        <input type="radio" name="running_preference" id="both" value="both" required>
                    </div>
                </div>
                <button type="submit" class="join-button">Let's Run!</button>
          <div></div>
          <div></div>
        </form>
      </section>
    </main>

    <!--Footer-->
    <footer>
      <ul id="social-networks">
        <li>
          <a
            href="https://www.facebook.com/"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Facebook page (Opens in a new tab)"
            ><i class="fa-brands fa-facebook"></i></a>
        </li>
        <li>
          <a
            href="https://www.x.com/"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Twitter page (Opens in a new tab)"
            ><i class="fa-brands fa-square-x-twitter"></i></a>
        </li>
        <li>
          <a
            href="https://www.youtube.com/"
            target="_blank"
            rel="noopener"
            aria-label="Visit our YouTube page (Opens in a new tab)"
            ><i class="fa-brands fa-square-youtube"></i></a>
        </li>
        <li>
          <a
            href="https://www.instagram.com/"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Instagram page (Opens in a new tab)"
            ><i class="fa-brands fa-instagram"></i></a>
        </li>
      </ul>
    </footer>
     <!-- Font Awesome kit -->
    <script src="https://kit.fontawesome.com/d0511671cd.js" crossorigin="anonymous"></script>
  </body>
</html>
